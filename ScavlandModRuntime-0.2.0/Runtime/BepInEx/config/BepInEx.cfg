[Caching]
EnableAssemblyCache = true

[Logging]
UnityLogListening = false
LogConsoleToUnityLog = false

[Logging.Console]
Enabled = true

[Logging.Disk]
WriteUnityLog = false
AppendLog = false
Enabled = true

[Preloader]
ApplyRuntimePatches = true

[Preloader.Entrypoint]
Assembly = UnityEngine.CoreModule.dll
Type = Application
Method = .cctor
